name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      # -race is the point of running these in CI: the shadow path is a worker
      # pool reading atomics that the control plane writes.
      - run: go test -race ./proxy/...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # ponytail: npm install, not npm ci. The lockfile is written on Windows
      # ARM64, where npm never descends into the wasm32-wasi fallback builds of
      # the Tailwind and ESLint native binaries, so it is missing entries that
      # `npm ci` refuses to install without. The ceiling: the lock is advisory
      # here rather than enforced. Switch back to `npm ci` once the lock is
      # generated on Linux (a container, or a CI job that commits it).
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
